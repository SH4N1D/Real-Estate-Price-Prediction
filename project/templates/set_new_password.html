{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forgot.css' %}">
{% endblock %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="neumorphic-card form-container" data-aos="fade-up">
    <h1 class="gradient-text">Set Your New Password</h1>
    <p class="form-description">Please enter and confirm your new password.</p>

    <form method="post" class="neumorphic-form">
        {% csrf_token %}
        <div class="form-group-item">
            <label for="new_password1"><i class="fa-solid fa-lock"></i> New Password:</label>
            <input type="password" name="new_password1" id="new_password1" class="neumorphic-input" placeholder="Enter new password" required>
        </div>
        <div class="form-group-item">
            <label for="new_password2"><i class="fa-solid fa-lock"></i> Confirm New Password:</label>
            <input type="password" name="new_password2" id="new_password2" class="neumorphic-input" placeholder="Confirm new password" required>
        </div>
        <button type="submit" class="neumorphic-button register-button">Reset Password</button>
    </form>
</div>
{% endblock %}
